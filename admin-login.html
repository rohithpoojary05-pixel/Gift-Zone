<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift Zone - Admin Login</title>

<link rel="stylesheet" href="style.css">

<style>

    /* ==========================================
       ADMIN LOGIN SIZE
    ========================================== */

    .login-box {
        width: 100%;
        max-width: 430px;
        padding: 35px 30px;
    }

    .login-box h1 {
        font-size: 32px;
        margin-bottom: 8px;
    }

    .login-subtitle {
        font-size: 17px;
        margin-bottom: 25px;
    }

    .login-box label {
        display: block;
        text-align: left;
        font-size: 16px;
        font-weight: 600;
        margin: 15px 0 7px;
    }

    .login-box input {
        width: 100%;
        box-sizing: border-box;
        height: 52px;
        padding: 0 15px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 10px;
        outline: none;
    }

    .password-wrapper {
        position: relative;
        width: 100%;
    }

    .password-wrapper input {
        padding-right: 65px;
    }

    .show-password-button {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        padding: 8px;
    }

    .login-button {
        width: 100%;
        min-height: 52px;
        margin-top: 22px;
        font-size: 17px;
        cursor: pointer;
    }

    .continue-shopping {
        display: inline-block;
        margin-top: 20px;
    }

</style>


</head>

<body>

<div class="login-page">


<div class="login-box">

    <div class="login-logo">
        🎁
    </div>

    <h1>Gift Zone</h1>

    <p class="login-subtitle">
        👨‍💼 Distributor / Admin Login
    </p>


    <!-- ==========================================
         ADMIN LOGIN FORM
    =========================================== -->

    <form id="adminLoginForm">

        <label for="adminEmail">
            Admin Email Address
        </label>

        <input
            type="email"
            id="adminEmail"
            placeholder="Enter admin email"
            autocomplete="username"
            required
        >


        <label for="adminPassword">
            Admin Password
        </label>

        <div class="password-wrapper">

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-password-button"
                id="showPasswordButton"
            >
                👁️ Show
            </button>

        </div>


        <button
            type="submit"
            class="login-button"
            id="adminLoginButton"
        >
            👨‍💼 Admin Login
        </button>

    </form>


    <a
        href="index.html"
        class="continue-shopping"
    >
        ← Back to Gift Zone
    </a>

</div>


</div>

<!-- ==========================================
     FIREBASE ADMIN LOGIN
=========================================== -->

<script type="module">

    import {
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    import {
        auth,
        db
    } from "./firebase.js";


    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    const passwordInput =
        document.getElementById("adminPassword");

    const showPasswordButton =
        document.getElementById("showPasswordButton");


    showPasswordButton.addEventListener(
        "click",
        function() {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                showPasswordButton.textContent =
                    "🙈 Hide";

            } else {

                passwordInput.type = "password";

                showPasswordButton.textContent =
                    "👁️ Show";

            }

        }
    );


    // ==========================================
    // ADMIN LOGIN
    // ==========================================

    document
        .getElementById("adminLoginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("adminEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            const loginButton =
                document.getElementById("adminLoginButton");


            loginButton.disabled = true;

            loginButton.textContent =
                "🔄 Checking Admin Account...";


            try {

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                // ==========================================
                // CHECK ADMIN DOCUMENT
                // ==========================================

                const adminRef =
                    doc(
                        db,
                        "admins",
                        user.uid
                    );


                const adminSnapshot =
                    await getDoc(adminRef);


                if (!adminSnapshot.exists()) {

                    await auth.signOut();

                    alert(
                        "❌ This account is not registered as a Gift Zone Admin."
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "👨‍💼 Admin Login";

                    return;

                }


                // ==========================================
                // CHECK ADMIN ROLE
                // ==========================================

                const adminData =
                    adminSnapshot.data();


                if (adminData.role !== "admin") {

                    await auth.signOut();

                    alert(
                        "❌ Admin permission not found for this account."
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "👨‍💼 Admin Login";

                    return;

                }


                // ==========================================
                // SAVE ADMIN SESSION
                // ==========================================

                localStorage.setItem(
                    "giftZoneAdminLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "giftZoneAdminEmail",
                    user.email
                );


                alert(
                    "✅ Admin Login Successful!\n\n" +
                    "Welcome to Gift Zone Distributor Panel."
                );


                window.location.href =
                    "admin-orders.html";


            } catch (error) {

                console.error(
                    "Admin Login Error:",
                    error
                );


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    alert(
                        "❌ Incorrect admin email or password."
                    );

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    alert(
                        "❌ Please enter a valid email address."
                    );

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    alert(
                        "⚠️ Too many login attempts.\n\n" +
                        "Please wait and try again."
                    );

                }

                else if (
                    error.code ===
                    "permission-denied"
                ) {

                    alert(
                        "❌ Firebase permission denied.\n\n" +
                        "Please check the Admin Firestore setup."
                    );

                }

                else {

                    alert(
                        "❌ Admin login failed.\n\n" +
                        error.message
                    );

                }


                loginButton.disabled = false;

                loginButton.textContent =
                    "👨‍💼 Admin Login";

            }

        });

</script>

</body>

</html>
