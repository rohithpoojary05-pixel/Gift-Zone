<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift Zone - Login</title>

<link rel="stylesheet" href="style.css">

<style>

    /* ==========================================
       PASSWORD FIELD
    ========================================== */

    .password-wrapper {
        position: relative;
        width: 100%;
    }

    .password-wrapper input {
        width: 100%;
        box-sizing: border-box;
        padding-right: 45px !important;
    }


    /* ==========================================
       SIMPLE EYE BUTTON
    ========================================== */

    .password-wrapper .password-eye {
        position: absolute !important;
        right: 10px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;

        width: 28px !important;
        height: 28px !important;

        min-width: 28px !important;
        min-height: 28px !important;

        padding: 0 !important;
        margin: 0 !important;

        border: none !important;
        outline: none !important;

        background: transparent !important;
        box-shadow: none !important;

        display: flex !important;
        align-items: center !important;
        justify-content: center !important;

        cursor: pointer;
    }


    /* ==========================================
       EYE
    ========================================== */

    .eye {
        position: relative;

        width: 18px;
        height: 12px;

        border: 1.7px solid #666;
        border-radius: 50% / 65%;

        display: block;
    }

    .eye::after {
        content: "";

        position: absolute;

        width: 5px;
        height: 5px;

        background: #666;

        border-radius: 50%;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);
    }


    /* ==========================================
       EYE WITH SLASH
    ========================================== */

    .eye.closed::before {
        content: "";

        position: absolute;

        width: 23px;
        height: 1.7px;

        background: #666;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%) rotate(-35deg);

        z-index: 2;
    }


    .password-wrapper .password-eye:hover,
    .password-wrapper .password-eye:focus,
    .password-wrapper .password-eye:active {
        background: transparent !important;
        box-shadow: none !important;
        outline: none !important;
    }

</style>


</head>

<body>

<div class="login-page">


<div class="login-box">

    <div class="login-logo">
        🎁
    </div>

    <h1>Gift Zone</h1>

    <p class="login-subtitle">
        Login to continue your surprise journey ❤️
    </p>


    <!-- ==============================
         LOGIN FORM
    =============================== -->

    <form id="loginForm">

        <label for="loginEmail">
            Email Address
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email address"
            required
        >


        <label for="loginPassword">
            Password
        </label>


        <div class="password-wrapper">

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="password-eye"
                id="passwordEye"
                aria-label="Show password"
                title="Show password"
            >

                <span
                    class="eye closed"
                    id="eyeIcon"
                ></span>

            </button>

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            🔐 Login
        </button>

    </form>


    <!-- ==============================
         FORGOT PASSWORD
    =============================== -->

    <a
        href="#"
        class="forgot-password"
        id="forgotPassword"
    >
        Forgot Password?
    </a>


    <div class="login-divider">
        <span>OR</span>
    </div>


    <!-- ==============================
         CREATE ACCOUNT
    =============================== -->

    <p class="create-account">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </p>


    <!-- ==============================
         CONTINUE SHOPPING
    =============================== -->

    <a
        href="index.html"
        class="continue-shopping"
    >
        ← Continue Shopping
    </a>

</div>


</div>

<!-- ==========================================
     FIREBASE LOGIN
=========================================== -->

<script type="module">

    import {
        signInWithEmailAndPassword,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
        auth
    } from "./firebase.js";


    // ==========================================
    // PASSWORD SHOW / HIDE
    // ==========================================

    const passwordInput =
        document.getElementById("loginPassword");

    const passwordEye =
        document.getElementById("passwordEye");

    const eyeIcon =
        document.getElementById("eyeIcon");


    passwordEye.addEventListener(
        "click",
        function () {

            if (passwordInput.type === "password") {

                // SHOW PASSWORD
                passwordInput.type = "text";

                eyeIcon.classList.remove("closed");

                passwordEye.setAttribute(
                    "aria-label",
                    "Hide password"
                );

                passwordEye.setAttribute(
                    "title",
                    "Hide password"
                );

            } else {

                // HIDE PASSWORD
                passwordInput.type = "password";

                eyeIcon.classList.add("closed");

                passwordEye.setAttribute(
                    "aria-label",
                    "Show password"
                );

                passwordEye.setAttribute(
                    "title",
                    "Show password"
                );

            }

        }
    );


    // ==========================================
    // LOGIN FORM
    // ==========================================

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;


                const loginButton =
                    document.getElementById("loginButton");


                if (!email || !password) {

                    alert(
                        "Please enter your email and password."
                    );

                    return;

                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "🔄 Logging in...";


                try {

                    const userCredential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;


                    const loggedInCustomer = {

                        customerId:
                            user.uid,

                        name:
                            user.displayName || "",

                        email:
                            user.email,

                        loginTime:
                            new Date().toLocaleString("en-IN")

                    };


                    localStorage.setItem(
                        "giftZoneLoggedInCustomer",
                        JSON.stringify(
                            loggedInCustomer
                        )
                    );


                    alert(
                        "❤️ Login successful!\n\n" +
                        "Welcome to Gift Zone!"
                    );


                    window.location.href =
                        "index.html";


                } catch (error) {

                    console.error(
                        "Firebase Login Error:",
                        error
                    );


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        alert(
                            "❌ Incorrect email or password."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        alert(
                            "❌ No Gift Zone account found with this email.\n\n" +
                            "Please create an account first."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        alert(
                            "❌ Incorrect password."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        alert(
                            "❌ Please enter a valid email address."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        alert(
                            "⚠️ Too many login attempts.\n\n" +
                            "Please wait a while and try again."
                        );

                    }

                    else {

                        alert(
                            "❌ Login failed.\n\n" +
                            error.message
                        );

                    }


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "🔐 Login";

                }

            }
        );


    // ==========================================
    // FORGOT PASSWORD
    // ==========================================

    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    alert(
                        "Please enter your email address first."
                    );

                    document
                        .getElementById("loginEmail")
                        .focus();

                    return;

                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    alert(
                        "📧 Password reset email sent!\n\n" +
                        "Please check your email and follow the instructions."
                    );


                } catch (error) {

                    console.error(
                        "Password Reset Error:",
                        error
                    );


                    if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        alert(
                            "❌ No Gift Zone account was found with this email."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        alert(
                            "❌ Please enter a valid email address."
                        );

                    }

                    else {

                        alert(
                            "❌ Could not send password reset email.\n\n" +
                            error.message
                        );

                    }

                }

            }
        );

</script>

</body>

</html>
