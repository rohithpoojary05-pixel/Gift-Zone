<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift Zone - Login</title>

<link rel="stylesheet" href="style.css">

<style>

    /* Password show / hide only */

    .password-wrapper {
        position: relative;
        width: 100%;
    }

    .password-wrapper input {
        width: 100%;
        box-sizing: border-box;
        padding-right: 75px;
    }

    .show-password-button {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        padding: 8px;
    }

</style>


</head>

<body>

<div class="login-page">


<div class="login-box">

    <div class="login-logo">
        🎁
    </div>

    <h1>Gift Zone</h1>

    <p class="login-subtitle">
        Login to continue your surprise journey ❤️
    </p>


    <!-- ==============================
         LOGIN FORM
    =============================== -->

    <form id="loginForm">

        <label for="loginEmail">
            Email Address
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email address"
            required
        >


        <label for="loginPassword">
            Password
        </label>

        <div class="password-wrapper">

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-password-button"
                id="showPasswordButton"
            >
                👁️ Show
            </button>

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            🔐 Login
        </button>

    </form>


    <!-- ==============================
         FORGOT PASSWORD
    =============================== -->

    <a
        href="#"
        class="forgot-password"
        id="forgotPassword"
    >
        Forgot Password?
    </a>


    <div class="login-divider">
        <span>OR</span>
    </div>


    <!-- ==============================
         CREATE ACCOUNT
    =============================== -->

    <p class="create-account">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </p>


    <!-- ==============================
         CONTINUE SHOPPING
    =============================== -->

    <a
        href="index.html"
        class="continue-shopping"
    >
        ← Continue Shopping
    </a>

</div>


</div>

<!-- ==========================================
     FIREBASE LOGIN
=========================================== -->

<script type="module">

    import {
        signInWithEmailAndPassword,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
        auth
    } from "./firebase.js";


    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    const passwordInput =
        document.getElementById("loginPassword");

    const showPasswordButton =
        document.getElementById("showPasswordButton");


    showPasswordButton.addEventListener(
        "click",
        function() {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                showPasswordButton.textContent =
                    "🙈 Hide";

            } else {

                passwordInput.type = "password";

                showPasswordButton.textContent =
                    "👁️ Show";

            }

        }
    );


    // ==========================================
    // LOGIN FORM
    // ==========================================

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            const loginButton =
                document.getElementById("loginButton");


            // ==========================================
            // CHECK DETAILS
            // ==========================================

            if (!email || !password) {

                alert(
                    "Please enter your email and password."
                );

                return;

            }


            // ==========================================
            // CHANGE BUTTON
            // ==========================================

            loginButton.disabled = true;

            loginButton.textContent =
                "🔄 Logging in...";


            try {

                // ==========================================
                // FIREBASE LOGIN
                // ==========================================

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                // ==========================================
                // SAVE CUSTOMER SESSION
                // ==========================================

                const loggedInCustomer = {

                    customerId:
                        user.uid,

                    name:
                        user.displayName || "",

                    email:
                        user.email,

                    loginTime:
                        new Date().toLocaleString("en-IN")

                };


                localStorage.setItem(

                    "giftZoneLoggedInCustomer",

                    JSON.stringify(
                        loggedInCustomer
                    )

                );


                // ==========================================
                // SUCCESS
                // ==========================================

                alert(
                    "❤️ Login successful!\n\n" +
                    "Welcome to Gift Zone!"
                );


                // ==========================================
                // GO TO HOME
                // ==========================================

                window.location.href =
                    "index.html";


            } catch (error) {

                console.error(
                    "Firebase Login Error:",
                    error
                );


                // ==========================================
                // ERROR MESSAGES
                // ==========================================

                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    alert(
                        "❌ Incorrect email or password."
                    );

                }

                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    alert(
                        "❌ No Gift Zone account found with this email.\n\n" +
                        "Please create an account first."
                    );

                }

                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    alert(
                        "❌ Incorrect password."
                    );

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    alert(
                        "❌ Please enter a valid email address."
                    );

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    alert(
                        "⚠️ Too many login attempts.\n\n" +
                        "Please wait a while and try again."
                    );

                }

                else {

                    alert(
                        "❌ Login failed.\n\n" +
                        error.message
                    );

                }


                // Restore button

                loginButton.disabled = false;

                loginButton.textContent =
                    "🔐 Login";

            }

        });


    // ==========================================
    // FORGOT PASSWORD
    // ==========================================

    document
        .getElementById("forgotPassword")
        .addEventListener("click", async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim()
                    .toLowerCase();


            if (!email) {

                alert(
                    "Please enter your email address first."
                );

                document
                    .getElementById("loginEmail")
                    .focus();

                return;

            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                alert(

                    "📧 Password reset email sent!\n\n" +
                    "Please check your email and follow the instructions."

                );


            } catch (error) {

                console.error(
                    "Password Reset Error:",
                    error
                );


                if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    alert(
                        "❌ No Gift Zone account was found with this email."
                    );

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    alert(
                        "❌ Please enter a valid email address."
                    );

                }

                else {

                    alert(
                        "❌ Could not send password reset email.\n\n" +
                        error.message
                    );

                }

            }

        });

</script>

</body>

</html>
