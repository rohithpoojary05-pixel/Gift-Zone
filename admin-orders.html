<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift Zone - Distributor Orders</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff5f8;
    color:#222;
    padding-bottom:40px;
}

header{
    background:#e91e63;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.admin-title{
    font-size:15px;
    background:white;
    color:#e91e63;
    padding:8px 14px;
    border-radius:20px;
    font-weight:bold;
}

.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}

.page-title{
    text-align:center;
    margin-bottom:8px;
    color:#e91e63;
    font-size:30px;
}

.page-subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.top-bar{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:25px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.search-box{
    flex:1;
    min-width:220px;
}

.search-box input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.search-box input:focus{
    border-color:#e91e63;
}

.refresh-btn{
    background:#e91e63;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:hover{
    background:#c2185b;
}

.refresh-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.order-count{
    background:white;
    padding:15px 18px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
    font-weight:bold;
    color:#555;
}

.order-count span{
    color:#e91e63;
}

.loading-message{
    background:white;
    padding:40px 20px;
    border-radius:15px;
    text-align:center;
    color:#666;
}

.error-message{
    background:white;
    color:#c62828;
    border:1px solid #ef9a9a;
    padding:25px;
    border-radius:12px;
    text-align:center;
    line-height:1.7;
}

.no-orders{
    background:white;
    text-align:center;
    padding:50px 20px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.no-orders-icon{
    font-size:55px;
    margin-bottom:15px;
}

.no-orders h2{
    color:#e91e63;
    margin-bottom:8px;
}

.no-orders p{
    color:#777;
}

.order-card{
    background:white;
    border-radius:15px;
    margin-bottom:25px;
    padding:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.09);
    border-left:5px solid #e91e63;
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    border-bottom:1px solid #eee;
    padding-bottom:15px;
    margin-bottom:18px;
}

.order-id{
    font-size:18px;
    font-weight:bold;
    color:#e91e63;
}

.order-date{
    color:#777;
    font-size:14px;
    margin-top:5px;
}

.section-title{
    color:#e91e63;
    font-size:17px;
    font-weight:bold;
    margin-bottom:10px;
}

.details-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:12px;
    margin-bottom:20px;
}

.detail-box{
    background:#fff8fa;
    padding:13px;
    border-radius:8px;
    border:1px solid #f5d8e2;
}

.detail-label{
    font-size:12px;
    color:#888;
    margin-bottom:4px;
    font-weight:bold;
}

.detail-value{
    font-size:15px;
    color:#222;
    word-break:break-word;
}

.gift-list{
    background:#fff8fa;
    border:1px solid #f5d8e2;
    padding:14px;
    border-radius:8px;
    margin-bottom:20px;
}

.gift-item{
    padding:8px 0;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.gift-item:last-child{
    border-bottom:none;
}

.message-box{
    background:#fff0f5;
    border-radius:8px;
    padding:14px;
    margin-bottom:20px;
    word-break:break-word;
}

.message-box strong{
    color:#e91e63;
}

.total-box{
    background:#f8f8f8;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

.total{
    font-size:22px;
    font-weight:bold;
    color:#e91e63;
}

.status-area{
    background:#fff4f7;
    border:1px solid #f2c8d7;
    padding:18px;
    border-radius:10px;
    margin-top:10px;
}

.status-label{
    font-weight:bold;
    color:#555;
    margin-bottom:8px;
}

.status-controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.status-select{
    flex:1;
    min-width:240px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
    font-size:15px;
}

.update-btn{
    background:#e91e63;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.update-btn:hover{
    background:#c2185b;
}

.update-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.status-message{
    margin-top:10px;
    color:#388e3c;
    font-weight:bold;
    display:none;
}

@media(max-width:600px){

    header{
        justify-content:center;
        text-align:center;
    }

    .page-title{
        font-size:25px;
    }

    .container{
        width:93%;
    }

    .order-card{
        padding:16px;
    }

    .gift-item{
        flex-direction:column;
    }

    .status-controls{
        flex-direction:column;
    }

    .status-select,
    .update-btn{
        width:100%;
    }

}

</style>

</head>

<body>

<header>


<div class="logo">
    🎁 Gift Zone
</div>

<div class="admin-title">
    👨‍💼 Distributor / Admin
</div>


</header>

<div class="container">


<h1 class="page-title">
    📦 All Customer Orders
</h1>

<p class="page-subtitle">
    Prepare gifts, manage deliveries and update customer order status
</p>


<div class="top-bar">

    <div class="search-box">

        <input
            type="text"
            id="searchOrders"
            placeholder="🔎 Search Order ID, Customer or Recipient..."
        >

    </div>

    <button
        class="refresh-btn"
        id="refreshBtn"
    >
        🔄 Refresh Orders
    </button>

</div>


<div class="order-count">

    Total Orders:
    <span id="orderCount">0</span>

</div>


<div id="ordersContainer">

    <div class="loading-message">
        🔄 Connecting to Gift Zone Firebase...
    </div>

</div>


</div>

<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import { auth, db } from "./firebase.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* =====================================================
   VARIABLES
===================================================== */

let allOrders = [];
let currentAdmin = null;


/* =====================================================
   STATUS LIST
===================================================== */

const statusList = [

    "Order Placed",
    "Gift Being Packed",
    "Gift Ready",
    "Delivery Person Picked Up",
    "Out for Delivery",
    "Delivered"

];


/* =====================================================
   ELEMENTS
===================================================== */

const ordersContainer =
    document.getElementById("ordersContainer");

const orderCount =
    document.getElementById("orderCount");

const searchInput =
    document.getElementById("searchOrders");

const refreshBtn =
    document.getElementById("refreshBtn");


/* =====================================================
   CUSTOMER ID
===================================================== */

function createCustomerId(uid){

    if(!uid){
        return "GZ-CUST-000000";
    }

    let hash = 0;

    for(let i = 0; i < uid.length; i++){

        hash =
            ((hash << 5) - hash) +
            uid.charCodeAt(i);

        hash |= 0;

    }

    const number =
        Math.abs(hash)
        .toString()
        .padStart(6,"0")
        .slice(-6);

    return "GZ-CUST-" + number;

}


/* =====================================================
   SAFE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

    if(!value){
        return "-";
    }

    try{

        let date;

        if(
            value &&
            typeof value.toDate === "function"
        ){

            date = value.toDate();

        }
        else if(
            value &&
            typeof value.seconds === "number"
        ){

            date =
                new Date(
                    value.seconds * 1000
                );

        }
        else{

            date = new Date(value);

        }

        if(isNaN(date.getTime())){
            return "-";
        }

        return date.toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(error){

        return "-";

    }

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message){

    ordersContainer.innerHTML = `

        <div class="error-message">

            ❌ <strong>Gift Zone Admin Error</strong>

            <br><br>

            ${message}

        </div>

    `;

    orderCount.textContent = "0";

}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function verifyAdmin(user){

    if(!user){

        showError(
            "You are not logged in.<br><br>" +
            "Please log in with:<br>" +
            "<strong>rohithpoojary05@gmail.com</strong>"
        );

        return false;

    }


    try{

        const adminRef =
            doc(
                db,
                "admins",
                user.uid
            );

        const adminSnapshot =
            await getDoc(adminRef);


        if(!adminSnapshot.exists()){

            showError(
                "Your Firebase account is logged in, " +
                "but this account is not registered as an admin."
            );

            return false;

        }


        const adminData =
            adminSnapshot.data();


        if(adminData.role !== "admin"){

            showError(
                "Admin document was found, " +
                "but the role is not 'admin'."
            );

            return false;

        }


        currentAdmin = user;

        return true;

    }
    catch(error){

        console.error(
            "ADMIN CHECK ERROR:",
            error
        );

        showError(
            "Admin verification failed.<br><br>" +
            "<strong>Firebase error:</strong><br>" +
            escapeHTML(
                error.message ||
                "Unknown Firebase error"
            )
        );

        return false;

    }

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    if(!currentAdmin){

        return;

    }


    refreshBtn.disabled = true;

    refreshBtn.textContent =
        "⏳ Loading...";


    ordersContainer.innerHTML = `

        <div class="loading-message">
            🔄 Loading customer orders from Firestore...
        </div>

    `;


    try{

        const ordersRef =
            collection(
                db,
                "orders"
            );


        const snapshot =
            await getDocs(
                ordersRef
            );


        allOrders =
            snapshot.docs.map(
                item => ({

                    documentId:item.id,

                    ...item.data()

                })
            );


        allOrders.sort(
            (a,b) => {

                const getTime = order => {

                    const value =
                        order.orderCreatedAt;

                    if(!value){
                        return 0;
                    }

                    if(
                        typeof value.toMillis === "function"
                    ){

                        return value.toMillis();

                    }

                    if(
                        typeof value.toDate === "function"
                    ){

                        return value.toDate().getTime();

                    }

                    if(
                        typeof value.seconds === "number"
                    ){

                        return value.seconds * 1000;

                    }

                    return 0;

                };

                return getTime(b) - getTime(a);

            }
        );


        renderOrders();


    }
    catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );

        showError(
            "Could not load customer orders.<br><br>" +
            "<strong>Firebase error:</strong><br>" +
            escapeHTML(
                error.message ||
                "Unknown error"
            )
        );

    }
    finally{

        refreshBtn.disabled = false;

        refreshBtn.textContent =
            "🔄 Refresh Orders";

    }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(){

    const searchText =
        searchInput.value
        .toLowerCase()
        .trim();


    let filteredOrders =
        allOrders;


    if(searchText){

        filteredOrders =
            allOrders.filter(
                order => {

                    const customerId =
                        createCustomerId(
                            order.userId
                        );


                    const text = [

                        order.orderId,
                        order.documentId,
                        customerId,
                        order.customerName,
                        order.customerPhone,
                        order.customerEmail,
                        order.recipientName,
                        order.recipientPhone,
                        order.address

                    ]
                    .map(
                        value =>
                            String(
                                value || ""
                            ).toLowerCase()
                    )
                    .join(" ");


                    return text.includes(
                        searchText
                    );

                }
            );

    }


    orderCount.textContent =
        filteredOrders.length;


    if(filteredOrders.length === 0){

        ordersContainer.innerHTML = `

            <div class="no-orders">

                <div class="no-orders-icon">
                    📦
                </div>

                <h2>No Orders Found</h2>

                <p>
                    ${
                        allOrders.length === 0
                        ? "No customer orders have been found in Firestore."
                        : "No order matches your search."
                    }
                </p>

            </div>

        `;

        return;

    }


    ordersContainer.innerHTML =
        filteredOrders
        .map(
            order =>
                createOrderCard(order)
        )
        .join("");

}


/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(order){

    const orderId =
        order.documentId ||
        order.orderId;


    const customerId =
        createCustomerId(
            order.userId
        );


    const orderStatus =
        order.orderStatus ||
        "Order Placed";


    let giftsHTML =

        `<div class="gift-item">
            No gift information available
        </div>`;


    if(
        Array.isArray(order.cart) &&
        order.cart.length > 0
    ){

        giftsHTML =
            order.cart
            .map(
                item => `

                    <div class="gift-item">

                        <span>
                            🎁
                            ${escapeHTML(
                                item.name || "Gift"
                            )}
                            ×
                            ${escapeHTML(
                                item.quantity || 1
                            )}
                        </span>

                        <strong>
                            ₹${escapeHTML(
                                item.price || 0
                            )}
                        </strong>

                    </div>

                `
            )
            .join("");

    }


    const statusOptions =
        statusList
        .map(
            status => `

                <option
                    value="${escapeHTML(status)}"
                    ${
                        status === orderStatus
                        ? "selected"
                        : ""
                    }
                >
                    ${escapeHTML(status)}
                </option>

            `
        )
        .join("");


    return `

        <div
            class="order-card"
            data-order-id="${escapeHTML(orderId)}"
        >

            <div class="order-header">

                <div>

                    <div class="order-id">

                        🧾
                        ${escapeHTML(
                            order.orderId ||
                            orderId ||
                            "Unknown"
                        )}

                    </div>

                    <div class="order-date">

                        Ordered:
                        ${formatDate(
                            order.orderCreatedAt
                        )}

                    </div>

                </div>

            </div>


            <div class="section-title">
                👤 Customer Details
            </div>

            <div class="details-grid">

                <div class="detail-box">

                    <div class="detail-label">
                        CUSTOMER ID
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(customerId)}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        CUSTOMER NAME
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            order.customerName || "-"
                        )}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        CUSTOMER PHONE
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            order.customerPhone || "-"
                        )}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        CUSTOMER EMAIL
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            order.customerEmail || "-"
                        )}
                    </div>

                </div>

            </div>


            <div class="section-title">
                🎉 Recipient Details
            </div>

            <div class="details-grid">

                <div class="detail-box">

                    <div class="detail-label">
                        RECIPIENT NAME
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            order.recipientName || "-"
                        )}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        RECIPIENT PHONE
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            order.recipientPhone || "-"
                        )}
                    </div>

                </div>

            </div>


            <div class="section-title">
                🚚 Delivery Details
            </div>

            <div class="details-grid">

                <div class="detail-box">

                    <div class="detail-label">
                        DELIVERY DATE
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            order.deliveryDate || "-"
                        )}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        DELIVERY TIME
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            order.deliveryTime || "-"
                        )}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        DELIVERY ADDRESS
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            order.address || "-"
                        )}
                    </div>

                </div>

            </div>


            <div class="section-title">
                🎁 Gift Details
            </div>

            <div class="gift-list">

                ${giftsHTML}

            </div>


            <div class="message-box">

                <strong>
                    💌 Surprise Message
                </strong>

                <br><br>

                ${escapeHTML(
                    order.surpriseMessage ||
                    "No message"
                )}

            </div>


            <div class="message-box">

                <strong>
                    📝 Special Instructions
                </strong>

                <br><br>

                ${escapeHTML(
                    order.specialInstructions ||
                    "No special instructions"
                )}

            </div>


            <div class="total-box">

                <div>
                    💳 Payment Method:
                    ${escapeHTML(
                        order.paymentMethod || "-"
                    )}
                </div>

                <div>
                    Payment Status:
                    ${escapeHTML(
                        order.paymentStatus || "-"
                    )}
                </div>

                <br>

                <div class="total">

                    Total:
                    ₹${escapeHTML(
                        order.total || 0
                    )}

                </div>

            </div>


            <div class="status-area">

                <div class="status-label">

                    📍 Current Order Status:
                    <strong>
                        ${escapeHTML(orderStatus)}
                    </strong>

                </div>


                <div class="status-controls">

                    <select
                        class="status-select"
                        data-status-for="${escapeHTML(orderId)}"
                    >

                        ${statusOptions}

                    </select>


                    <button
                        class="update-btn"
                        data-update-order="${escapeHTML(orderId)}"
                    >

                        💾 Update Status

                    </button>

                </div>


                <div
                    class="status-message"
                    data-message-for="${escapeHTML(orderId)}"
                >
                    ✅ Status updated successfully!
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateStatus(orderId, button){

    if(!currentAdmin){

        alert(
            "Admin login is required."
        );

        return;

    }


    const card =
        button.closest(".order-card");


    if(!card){

        return;

    }


    const select =
        card.querySelector(
            ".status-select"
        );


    if(!select){

        alert(
            "Status selector not found."
        );

        return;

    }


    const newStatus =
        select.value;


    button.disabled = true;

    button.textContent =
        "⏳ Updating...";


    try{

        const orderRef =
            doc(
                db,
                "orders",
                orderId
            );


        await updateDoc(
            orderRef,
            {

                orderStatus:
                    newStatus,

                statusUpdatedAt:
                    serverTimestamp()

            }
        );


        const order =
            allOrders.find(
                item =>
                    String(
                        item.documentId
                    ) === String(orderId)
            );


        if(order){

            order.orderStatus =
                newStatus;

        }


        const message =
            card.querySelector(
                ".status-message"
            );


        if(message){

            message.textContent =
                "✅ Status updated successfully!";

            message.style.display =
                "block";

        }


    }
    catch(error){

        console.error(
            "UPDATE STATUS ERROR:",
            error
        );

        alert(
            "Could not update order status.\n\n" +
            (
                error.message ||
                "Unknown Firebase error"
            )
        );

    }
    finally{

        button.disabled = false;

        button.textContent =
            "💾 Update Status";

    }

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

ordersContainer.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                ".update-btn"
            );


        if(!button){

            return;

        }


        const orderId =
            button.dataset.updateOrder;


        updateStatus(
            orderId,
            button
        );

    }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    renderOrders
);


/* =====================================================
   REFRESH
===================================================== */

refreshBtn.addEventListener(
    "click",
    loadOrders
);


/* =====================================================
   FIREBASE AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        console.log(
            "Gift Zone Firebase Auth User:",
            user
        );


        const verified =
            await verifyAdmin(user);


        if(!verified){

            return;

        }


        await loadOrders();

    }
);

</script>

</body>

</html>
